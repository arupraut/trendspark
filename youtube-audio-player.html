<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Audio Player with Playlist</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      height: 100vh;
    }

    /* Sidebar Playlist */
    .playlist {
      width: 250px;
      background: #1a1a1a;
      overflow-y: auto;
      border-right: 2px solid #222;
      padding: 10px;
    }

    .playlist h3 {
      text-align: center;
      color: #1db954;
    }

    .song {
      padding: 10px;
      margin: 5px 0;
      cursor: pointer;
      border-radius: 5px;
      background: #222;
      transition: background 0.3s;
    }

    .song:hover {
      background: #333;
    }

    .song.active {
      background: #1db954;
      color: #fff;
      font-weight: bold;
    }

    /* Player Section */
    .player {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    #video {
      display: none;
    }

    button {
      background: #1db954;
      border: none;
      color: white;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #17a44d;
    }

    .progress-container {
      width: 80%;
      background: #333;
      height: 6px;
      border-radius: 3px;
      margin: 20px 0;
      position: relative;
      cursor: pointer;
    }

    .progress {
      background: #1db954;
      height: 100%;
      width: 0%;
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .volume-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    input[type="range"] {
      width: 120px;
    }
  </style>
</head>
<body>
  <!-- Sidebar Playlist -->
  <div class="playlist" id="playlist">
    <h3>🎶 Playlist</h3>
    <div class="song" data-id="YgmLGhR-r4U">Kali Puja Theme</div>
    <div class="song" data-id="jNQXAC9IVRw">Sample Track</div>
    <div class="song" data-id="3JZ_D3ELwOQ">Charlie Puth - Attention</div>
    <div class="song" data-id="CevxZvSJLk8">Katy Perry - Roar</div>
  </div>

  <!-- Main Player -->
  <div class="player">
    <h2 id="currentTitle">🎧 Now Playing: Kali Puja Theme</h2>
    <div id="video"></div>

    <div>
      <button id="playBtn">▶️ Play</button>
      <button id="pauseBtn">⏸️ Pause</button>
    </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress" id="progress"></div>
    </div>

    <div class="volume-container">
      <label for="volume">🔊</label>
      <input type="range" id="volume" min="0" max="100" value="50">
    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let progressInterval;
    let isDragging = false;
    let currentSongId = "YgmLGhR-r4U"; // default
    let currentTitle = document.getElementById("currentTitle");

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("video", {
        height: "0",
        width: "0",
        videoId: currentSongId,
        playerVars: { autoplay: 0 },
        events: { onReady: onPlayerReady },
      });
    }

    function onPlayerReady() {
      const playBtn = document.getElementById("playBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const progressContainer = document.getElementById("progressContainer");
      const progress = document.getElementById("progress");
      const volumeSlider = document.getElementById("volume");
      const playlist = document.getElementById("playlist");
      const songs = playlist.querySelectorAll(".song");

      // Highlight default song
      highlightCurrent(currentSongId);

      // Play selected song
      songs.forEach(song => {
        song.addEventListener("click", () => {
          const videoId = song.getAttribute("data-id");
          const title = song.textContent;
          currentSongId = videoId;
          currentTitle.textContent = `🎧 Now Playing: ${title}`;
          highlightCurrent(videoId);
          player.loadVideoById(videoId);
        });
      });

      playBtn.addEventListener("click", () => {
        player.playVideo();
        startProgressTracking();
      });

      pauseBtn.addEventListener("click", () => {
        player.pauseVideo();
        stopProgressTracking();
      });

      // Progress tracking
      function startProgressTracking() {
        clearInterval(progressInterval);
        progressInterval = setInterval(() => {
          if (player && player.getDuration) {
            const duration = player.getDuration();
            const current = player.getCurrentTime();
            if (!isDragging && duration > 0) {
              progress.style.width = (current / duration) * 100 + "%";
            }
          }
        }, 500);
      }

      function stopProgressTracking() {
        clearInterval(progressInterval);
      }

      // Seek/drag
      progressContainer.addEventListener("mousedown", (e) => {
        isDragging = true;
        updateProgress(e);
      });
      document.addEventListener("mouseup", () => (isDragging = false));
      progressContainer.addEventListener("mousemove", (e) => {
        if (isDragging) updateProgress(e);
      });

      function updateProgress(e) {
        const rect = progressContainer.getBoundingClientRect();
        const percent = Math.min(Math.max(0, e.clientX - rect.left), rect.width) / rect.width;
        progress.style.width = percent * 100 + "%";
        const newTime = percent * player.getDuration();
        player.seekTo(newTime, true);
      }

      // Volume control
      volumeSlider.addEventListener("input", (e) => {
        player.setVolume(e.target.value);
      });

      player.setVolume(volumeSlider.value);

      // Helper: highlight current song
      function highlightCurrent(videoId) {
        songs.forEach(s => s.classList.remove("active"));
        const activeSong = Array.from(songs).find(s => s.getAttribute("data-id") === videoId);
        if (activeSong) activeSong.classList.add("active");
      }
    }
  </script>
</body>
</html>
